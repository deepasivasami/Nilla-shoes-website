    <script>



let updateDashboardCounts = () => {

    let customers = JSON.parse(localStorage.getItem("customerList")) || [];
    document.getElementById("total").innerText = customers.length;

    let products = JSON.parse(localStorage.getItem("productList")) || [];
    document.getElementById("produt_total").innerText = products.length;
};

updateDashboardCounts();

/* Sidebar Toggle */
let menuBtn = document.querySelector(".fa-bars");
let sidebar = document.querySelector("aside");

menuBtn.addEventListener("click", () => {
    sidebar.classList.toggle("active");



    
});
document.addEventListener("click", function(e){
    if(!sidebar.contains(e.target) && !menuBtn.contains(e.target)){
        sidebar.classList.remove("active");
    }
});
